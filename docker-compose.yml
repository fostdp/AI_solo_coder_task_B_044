version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ancient_maritime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  voyage-loader:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BINARY: voyage_loader
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ancient_maritime
      CONFIG_PATH: /app/config.toml
      RUST_LOG: voyage_loader=debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/config.toml:/app/config.toml
      - ./frontend:/app/frontend

  network-analyzer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BINARY: network_analyzer
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ancient_maritime
      CONFIG_PATH: /app/config.toml
      RUST_LOG: network_analyzer=debug
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/config.toml:/app/config.toml

  storm-risk-modeler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BINARY: storm_risk_modeler
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ancient_maritime
      CONFIG_PATH: /app/config.toml
      RUST_LOG: storm_risk_modeler=debug
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/config.toml:/app/config.toml

  data-loader:
    image: python:3.11-slim
    working_dir: /scripts
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ancient_maritime
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./scripts:/scripts
    command: >
      bash -c "
        pip install psycopg2-binary &&
        python simulate_voyages.py &&
        python simulate_climate.py
      "

volumes:
  pgdata:
