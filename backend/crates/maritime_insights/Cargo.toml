[package]
name = "maritime-insights"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "maritime_insights"
path = "src/main.rs"

[dependencies]
maritime-common = { path = "../maritime_common" }
port-rise-fall = { path = "../port_rise_fall" }
route-simulator = { path = "../route_simulator" }
goods-spread-network = { path = "../goods_spread_network" }
modern-shipping-comparator = { path = "../modern_shipping_comparator" }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
rand = "0.8"
