[package]
name = "route-simulator"
version = "0.1.0"
edition = "2021"

[dependencies]
maritime-common = { path = "../maritime_common" }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
