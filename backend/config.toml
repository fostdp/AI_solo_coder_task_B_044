[database]
url = "postgres://postgres:postgres@localhost:5432/ancient_maritime"
max_connections = 20

[voyage_loader]
port = 3001
max_query_limit = 2000

[network_analyzer]
port = 3002
betweenness_sample_size = 20
community_max_iterations = 10
hub_top_k = 5

[storm_risk_modeler]
port = 3003

[storm_risk_modeler.logistic_regression]
learning_rate = 0.01
iterations = 500
l2_lambda_sparse = 1.0
l2_lambda_medium = 0.5
l2_lambda_dense = 0.1
sparse_threshold = 50
medium_threshold = 200
prior_variance = 4.0
prior_storm_rate = 0.15
prediction_shrinkage_k = 5.0
smoothing_k = 10.0

[storm_risk_modeler.random_forest]
n_trees = 10
max_depth = 5
min_samples = 5
sample_ratio = 0.7

[maritime_insights]
port = 3004
metrics_port = 4004

[maritime_insights.panel_regression]
significance_level = 0.05
min_observations = 10
max_predictors = 8

[maritime_insights.granger_causality]
max_lags = 5
significance_level = 0.05
min_observations = 20

[maritime_insights.route_planning]
grid_resolution_km = 50.0
max_iterations = 10000
current_weight = 0.3
wind_weight = 0.3
storm_risk_weight = 0.2
distance_weight = 0.2

[maritime_insights.cargo_spread]
min_spread_threshold = 0.1
diffusion_decay_rate = 0.1
max_propagation_steps = 10

[maritime_insights.modern_comparison]
modern_risk_multiplier = 0.6
tech_improvement_factor = 0.7
weather_forecast_accuracy = 0.85
