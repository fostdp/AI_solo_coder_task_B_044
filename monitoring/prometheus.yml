global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ancient-maritime-monitor'

rule_files:

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'voyage-loader'
    static_configs:
      - targets: ['voyage-loader:4001']
    metrics_path: '/'

  - job_name: 'network-analyzer'
    static_configs:
      - targets: ['network-analyzer:4002']
    metrics_path: '/'

  - job_name: 'storm-risk-modeler'
    static_configs:
      - targets: ['storm-risk-modeler:4003']
    metrics_path: '/'

  - job_name: 'maritime-insights'
    static_configs:
      - targets: ['maritime-insights:4004']
    metrics_path: '/metrics'
